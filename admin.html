<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Console - GO-IN RESULTS Portal</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        govtBlue: '#0b409c',
        govtHeader: '#002663',
        govtGold: '#d4af37'
      }
    }
  }
}
</script>
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-100 text-[11px]">

<!-- PASSWORD GATEWAY OVERLAY -->
<div id="loginOverlay" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 p-6 rounded-lg shadow-2xl max-w-sm w-full border border-slate-700 space-y-4">
    <div class="text-center space-y-1">
      <div class="w-10 h-10 bg-yellow-400 text-govtHeader font-black rounded-lg mx-auto flex items-center justify-center text-sm shadow">GO</div>
      <h2 class="text-sm font-black uppercase text-govtHeader dark:text-yellow-300">Secure Admin Login</h2>
      <p class="text-[10px] text-slate-500">Enter password to access GO-IN Results Control Panel.</p>
    </div>
    
    <div class="space-y-2">
      <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded p-2 text-xs font-bold focus:outline-none focus:border-blue-600">
      <button onclick="verifyAdminPassword()" class="w-full bg-govtHeader hover:bg-blue-900 text-yellow-300 font-bold py-2 rounded text-xs transition shadow">
        LOGIN TO CONSOLE
      </button>
      <p id="loginErrorMsg" class="text-red-600 text-center font-bold text-[10px] hidden">Incorrect Password! Try again.</p>
    </div>
    <div class="text-center pt-2 border-t border-slate-200 dark:border-slate-700">
      <a href="index.html" class="text-blue-700 dark:text-blue-400 font-bold hover:underline text-[10px]">&larr; Back to Main Website</a>
    </div>
  </div>
</div>

<!-- ADMIN DASHBOARD CONTAINER -->
<div id="adminDashboard" class="hidden flex-1 flex flex-col justify-between">
  <header class="w-full bg-govtHeader text-white border-b-4 border-govtGold shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-yellow-400 text-govtHeader rounded-lg flex items-center justify-center font-black text-sm">GO</div>
        <div>
          <h1 class="text-sm sm:text-base font-black text-yellow-300 uppercase tracking-wide">Admin Control Panel</h1>
          <p class="text-[10px] text-slate-200">Manage Live Marquee, Press Releases & Exam Portal Alerts</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <a href="index.html" target="_blank" class="bg-blue-900 hover:bg-blue-800 text-white font-bold px-3 py-1.5 rounded text-xs transition">
          <i class="fa-solid fa-globe mr-1"></i> View Live Site
        </a>
        <button onclick="adminLogout()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-3 py-1.5 rounded text-xs transition">
          <i class="fa-solid fa-power-off mr-1"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto w-full p-4 space-y-4 flex-1">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-4 shadow-sm space-y-3">
        <h2 class="font-bold text-govtHeader dark:text-yellow-300 border-b dark:border-slate-700 pb-2">
          <i class="fa-solid fa-bullhorn mr-2 text-blue-700"></i> Update Marquee Ticker
        </h2>
        <div class="space-y-2">
          <label class="font-bold">Scrolling News Text *</label>
          <textarea id="marqueeTextInput" rows="3" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded p-2 text-xs"></textarea>
          <button onclick="saveMarqueeText()" class="bg-govtHeader text-white font-bold px-4 py-2 rounded text-xs">Update Marquee Live</button>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-4 shadow-sm space-y-3">
        <h2 class="font-bold text-govtHeader dark:text-yellow-300 border-b dark:border-slate-700 pb-2">
          <i class="fa-solid fa-plus-circle mr-2 text-blue-700"></i> Add New Notification Alert
        </h2>
        <div class="space-y-2">
          <input type="text" id="alertTitleInput" placeholder="Update Title" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded p-2 text-xs font-bold">
